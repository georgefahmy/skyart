<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Stratosphere Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#101f42"/>
      <stop offset="100%" stop-color="#070c1b"/>
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Flight Art Contrail / Ribbon Gradient -->
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="28%" stop-color="#7928ca"/>
      <stop offset="65%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#00dfd8"/>
    </linearGradient>

    <!-- Aircraft Body Gradient -->
    <linearGradient id="planeGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Canopy / Cockpit Gradient -->
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Radial Atmospheric Glow Behind Aircraft -->
    <radialGradient id="planeGlow" cx="68%" cy="32%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter for Vector Trail & Waypoints -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Aircraft Drop Shadow -->
    <filter id="planeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Badge Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#ringGrad)" stroke-width="5"/>

  <!-- Subtle Navigational Compass / Radar Graticules -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="180" stroke-dasharray="6,8"/>
    <circle cx="256" cy="256" r="110"/>
    <line x1="256" y1="56" x2="256" y2="456" stroke-dasharray="4,6"/>
    <line x1="56" y1="256" x2="456" y2="256" stroke-dasharray="4,6"/>
  </g>

  <!-- Atmospheric Glow in Flight Path Quadrant -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#planeGlow)"/>

  <!-- Flight Path Ribbon / Contrail Loop (The "Sky Art" drawing in the sky) -->
  <!-- Outer Glow Stroke -->
  <path d="M 88 385 C 150 420, 240 400, 280 330 C 315 270, 270 190, 205 210 C 145 230, 160 325, 230 335 C 310 345, 360 260, 372 175"
        fill="none"
        stroke="url(#trailGrad)"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.4"
        filter="url(#neonGlow)"/>

  <!-- Core Sharp Contrail Line -->
  <path d="M 88 385 C 150 420, 240 400, 280 330 C 315 270, 270 190, 205 210 C 145 230, 160 325, 230 335 C 310 345, 360 260, 372 175"
        fill="none"
        stroke="url(#trailGrad)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- GPS Waypoint Indicator Dots (Flight Plan Fixes) -->
  <!-- Waypoint 1 (Origin) -->
  <g transform="translate(88, 385)">
    <circle r="9" fill="#ff007a" filter="url(#neonGlow)"/>
    <circle r="4" fill="#ffffff"/>
  </g>

  <!-- Waypoint 2 (Lower Loop Turn) -->
  <g transform="translate(278, 332)">
    <circle r="8" fill="#a855f7" filter="url(#neonGlow)"/>
    <circle r="3.5" fill="#ffffff"/>
  </g>

  <!-- Waypoint 3 (Apex Turn) -->
  <g transform="translate(205, 210)">
    <circle r="8" fill="#3b82f6" filter="url(#neonGlow)"/>
    <circle r="3.5" fill="#ffffff"/>
  </g>

  <!-- Waypoint 4 (Loop Intersection / Inset) -->
  <g transform="translate(230, 335)">
    <circle r="7" fill="#00d8d6" filter="url(#neonGlow)"/>
    <circle r="3" fill="#ffffff"/>
  </g>

  <!-- Waypoint 5 (Climb Lead-in) -->
  <g transform="translate(340, 245)">
    <circle r="8" fill="#00f2fe" filter="url(#neonGlow)"/>
    <circle r="3.5" fill="#ffffff"/>
  </g>

  <!-- Aircraft (Sleek High-Performance Aerobatic / Sky Art Plane banking at 45° to top-right) -->
  <!-- Centered around anchor (372, 175) and rotated ~45 deg -->
  <g transform="translate(372, 175) rotate(45)" filter="url(#planeShadow)">
    <!-- Wings Vapor Whiskers (Speed lines from wingtips) -->
    <line x1="-68" y1="12" x2="-80" y2="40" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="68" y1="12" x2="80" y2="40" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Left Wing -->
    <path d="M -8 0 L -68 14 L -65 24 L -8 10 Z" fill="#cbd5e1"/>
    <!-- Right Wing -->
    <path d="M 8 0 L 68 14 L 65 24 L 8 10 Z" fill="#94a3b8"/>

    <!-- Main Wings Aero Blend -->
    <path d="M 0 -8 L -68 16 L -60 23 L -6 14 L -6 45 L -28 58 L -26 64 L 0 58 L 26 64 L 28 58 L 6 45 L 6 14 L 60 23 L 68 16 Z"
          fill="url(#planeGrad)"/>

    <!-- Horizontal Stabilizers / Tail -->
    <path d="M 0 46 L -30 60 L -27 67 L 0 60 L 27 67 L 30 60 Z" fill="#64748b"/>

    <!-- Fuselage Center Body -->
    <path d="M 0 -42 C -7 -20, -9 20, -6 54 L 0 62 L 6 54 C 9 20, 7 -20, 0 -42 Z" fill="url(#planeGrad)"/>

    <!-- Aerodynamic Canopy / Glass Cockpit -->
    <path d="M 0 -22 C -4 -12, -4 4, 0 14 C 4 4, 4 -12, 0 -22 Z" fill="url(#canopyGrad)"/>
    <!-- Canopy Highlight Glint -->
    <ellipse cx="-1.5" cy="-6" rx="1.5" ry="6" fill="#ffffff" opacity="0.75"/>

    <!-- Nose Cone Accent -->
    <circle cx="0" cy="-40" r="2.5" fill="#00f2fe"/>
  </g>

  <!-- Sparkle of Inspiration / GPS Lock Star at Top Right -->
  <g transform="translate(425, 95)" opacity="0.9">
    <path d="M 0 -14 Q 0 0 -14 0 Q 0 0 0 14 Q 0 0 14 0 Q 0 0 0 -14 Z" fill="#ffffff" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#00f2fe"/>
  </g>
</svg>
