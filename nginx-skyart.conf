server {
    server_name skyart.n890gf.com;

    # Block access to hidden files and directories (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block common automated bot probes, config file leaks & web vulnerability scanners
    location ~* (\.php|wp-admin|wp-login|xmlrpc\.php|phpmyadmin|\.bak|\.sql|composer\.json|appsettings.*\.json|auth\.json|package\.json|\.env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    listen 80;
}
